# Canonical hk check workflow from gootecks/hooks-lint-format/github. Copies replace the dependency install step.
name: hk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Install tsrs-lint
        run: | # zizmor: ignore[adhoc-packages] exact pin; tsrs-lint is CI-only, local builds use cargo
          npm install -g tsrs@0.25.0-ts7.1.0-beta
          mkdir -p ~/.local/bin
          ln -sf "$(npm prefix -g)/bin/tsrs-lint" ~/.local/bin/tsrs-lint

      - name: Install dependencies
        run: bun install

      - name: hk check
        run: hk check --all
